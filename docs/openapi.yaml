openapi: 3.0.3
info:
  title: RBAC Backend API
  description: Role-Based Access Control API with Maker-Approver workflow
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Approvals
  - name: Approval Configuration
  - name: Audit

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              required: [accessToken, refreshToken, user]
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                user:
                  $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actionType:
          type: string
        entityType:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, executed, failed, cancelled]
        requestedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ApprovalConfiguration:
      type: object
      properties:
        actionType:
          type: string
        requiresApproval:
          type: boolean
        minApprovers:
          type: integer
        isActive:
          type: boolean
        description:
          type: string

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (includes DB check)
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service not ready

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens refreshed

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke all sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions cleared

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile returned

  /users:
    get:
      tags: [Users]
      summary: List users
      security:
        - bearerAuth: []
    post:
      tags: [Users]
      summary: Create user (may require approval)
      security:
        - bearerAuth: []

  /approvals:
    get:
      tags: [Approvals]
      summary: List approval requests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: actionType
          in: query
          schema:
            type: string
        - name: requestedBy
          in: query
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time

  /approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve request
      security:
        - bearerAuth: []

  /approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject request
      security:
        - bearerAuth: []

  /approvals/{id}/cancel:
    post:
      tags: [Approvals]
      summary: Cancel own pending request
      security:
        - bearerAuth: []

  /approval-configurations:
    get:
      tags: [Approval Configuration]
      summary: List approval configurations
      security:
        - bearerAuth: []
    patch:
      tags: [Approval Configuration]
      summary: Not supported at collection level

  /approval-configurations/{actionType}:
    get:
      tags: [Approval Configuration]
      summary: Get configuration for action (URL-encode colons, e.g. users%3Acreate)
      security:
        - bearerAuth: []
    patch:
      tags: [Approval Configuration]
      summary: Update configuration for action
      security:
        - bearerAuth: []

  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      security:
        - bearerAuth: []
